<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nature Profile Card</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background: linear-gradient(rgba(0, 0, 0, 0.7), rgba(0, 0, 0, 0.7)), 
                        url('https://images.unsplash.com/photo-1501854140801-50d01698950b?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            padding: 20px;
        }
        
        .profile-card {
            width: 350px;
            background-color: rgba(255, 255, 255, 0.9);
            border-radius: 15px;
            overflow: hidden;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.3);
            transition: transform 0.3s ease;
        }
        
        .profile-card:hover {
            transform: translateY(-10px);
        }
        
        .card-header {
            height: 180px;
            background: url('https://images.unsplash.com/photo-1441974231531-c6227db76b6e?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
            position: relative;
        }
        
        .profile-img {
            width: 120px;
            height: 120px;
            border-radius: 50%;
            border: 5px solid white;
            position: absolute;
            bottom: -60px;
            left: 50%;
            transform: translateX(-50%);
            background: url('https://images.unsplash.com/photo-1494790108755-2616b612b786?ixlib=rb-1.2.1&auto=format&fit=crop&w=634&q=80');
            background-size: cover;
            background-position: center;
        }
        
        .card-body {
            padding: 60px 30px 30px;
            text-align: center;
        }
        
        .name {
            font-size: 24px;
            font-weight: 600;
            margin-bottom: 5px;
            color: #2c3e50;
        }
        
        .title {
            font-size: 16px;
            color: #7f8c8d;
            margin-bottom: 20px;
        }
        
        .description {
            font-size: 14px;
            line-height: 1.6;
            color: #555;
            margin-bottom: 25px;
        }
        
        .social-links {
            display: flex;
            justify-content: center;
            gap: 15px;
            margin-bottom: 25px;
        }
        
        .social-link {
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 18px;
            text-decoration: none;
            transition: transform 0.3s ease;
        }
        
        .social-link:hover {
            transform: scale(1.1);
        }
        
        .facebook {
            background-color: #3b5998;
        }
        
        .twitter {
            background-color: #1da1f2;
        }
        
        .instagram {
            background: linear-gradient(45deg, #f09433, #e6683c, #dc2743, #cc2366, #bc1888);
        }
        
        .linkedin {
            background-color: #0077b5;
        }
        
        .contact-btn {
            display: inline-block;
            padding: 10px 25px;
            background-color: #2ecc71;
            color: white;
            border-radius: 30px;
            text-decoration: none;
            font-weight: 500;
            transition: background-color 0.3s ease;
        }
        
        .contact-btn:hover {
            background-color: #27ae60;
        }
    </style>
</head>
<body>
    <div class="profile-card">
        <div class="card-header">
            <div class="profile-img"></div>
        </div>
        <div class="card-body">
            <h2 class="name">Ais Kian Billoso</h2>
            <p class="title">3rd year college student & a pro hero</p>
            <p class="description">I like cows bruv</p>
            <div class="social-links">
                <a href="#" class="social-link facebook">f</a>
                <a href="https://x.com/ais_kian?t=bkQREcqNqunqrAqWR9i4PA&s=09" class="social-link twitter">t</a>
                <a href="https://www.instagram.com/aiski.24?igsh=MTJuYmVjanE2Mm14Mg==" class="social-link instagram">i</a>
                <a href="#" class="social-link linkedin">in</a>
            </div>
            <a href="#" class="contact-btn">Contact Me</a>
        </div>
    </div>
</body>
</html>
